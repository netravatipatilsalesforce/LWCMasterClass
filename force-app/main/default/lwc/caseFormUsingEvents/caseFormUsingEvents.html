<template>
    <lightning-card title="Case form Using Events" class="slds-m-around_large">
    <div class="slds-card slds-m-around_large">
        <lightning-record-edit-form
            density="compact"
            object-api-name={objectApiName}
            onsuccess={handleSuccess}
            onsubmit={handleSubmit}
            onerror={handleError}
            onload={handleLoadEvent}
        >

        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2">
                 <lightning-input-field field-name="Subject" required></lightning-input-field>
            </div>
             <div class="slds-col slds-size_1-of-2">
                <lightning-input-field field-name="Product__c"></lightning-input-field>
            </div>
             <div class="slds-col slds-size_1-of-2">
                   <lightning-input-field field-name="Status" required></lightning-input-field>
            </div>
             <div class="slds-col slds-size_1-of-2">
                 <lightning-input-field field-name="Type"></lightning-input-field>
            </div>
             <div class="slds-col slds-size_1-of-2">
                <lightning-input-field field-name="Origin" required></lightning-input-field>
            </div>
             <div class="slds-col slds-size_1-of-2">
                 <lightning-input-field field-name="Priority" required></lightning-input-field>
            </div>
        </div>
           

            <div class="slds-align_absolute-center">
                <lightning-button label="Create Case" variant="Brand" type="submit" ></lightning-button>
                 <lightning-button label="Reset Case" variant="brand-outline" type="reset" class="slds-m-left_medium"></lightning-button>
            </div>
            

        </lightning-record-edit-form>
    </div>
    </lightning-card>
</template>
