<template>
    <lightning-card title="Upload File to Account">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <lightning-input type="file" label="Choose File" onchange={handleFileChange}></lightning-input>
        </div>

        <template lwc:if={fileSelected}>
            <p class="slds-m-around_medium">Original File : <strong> {originalFileName}</strong></p>
            <p class="slds-m-around_medium">File Size : {fileSize} KB</p>

             <lightning-input class="slds-p-around_medium"  label="Rename File" onchange={handleRename}>
             </lightning-input>

             <lightning-button class="slds-p-around_medium" variant="brand" label="Upload to Account"
              onclick={handleUpload}></lightning-button>

        </template>

        <template lwc:if={uploadStatus}>
            <p class="slds-m-around_medium  slds-text-color_success">{uploadStatus}</p>
        </template>

        <template lwc:if={error}>
            <p class="slds-m-around_medium slds-text-color_error">{error}</p>
        </template>
    </lightning-card>


</template>
